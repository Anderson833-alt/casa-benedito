<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Home - Casa Benedito</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- PIN Authentication Lock Screen -->
  <div class="lock-screen-overlay" id="lockScreen">
    <div class="lock-modal">
      <div class="lock-icon">🔒</div>
      <h2 class="lock-title">CASA BENEDITO</h2>
      <p class="lock-sub">Digite o PIN para desbloquear o painel</p>

      <div class="pin-dots">
        <span class="pin-dot" id="dot1"></span>
        <span class="pin-dot" id="dot2"></span>
        <span class="pin-dot" id="dot3"></span>
        <span class="pin-dot" id="dot4"></span>
      </div>

      <div class="pin-error" id="pinError">PIN incorreto. Tente novamente.</div>

      <div class="pin-keypad">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn key-clear" onclick="clearPin()">C</button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn key-back" onclick="backspacePin()">⌫</button>
      </div>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div class="dashboard-container" id="dashboardContainer">
    <!-- Top Header -->
    <header class="dashboard-header">
      <div class="header-left">
        <div class="clock-display" id="clock">00:00</div>
        <div class="date-display" id="date">Carregando data...</div>
      </div>

      <div class="header-center">
        <h1 class="home-title">CASA BENEDITO</h1>
        <div class="sync-badge" id="syncStatus">
          <span class="pulse-dot"></span>
          <span id="syncText">Tuya Cloud Conectado</span>
        </div>
      </div>

      <div class="header-right">
        <button class="icon-btn" id="btnLock" title="Bloquear Tela">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </button>
        <button class="icon-btn" id="btnFullscreen" title="Tela Cheia">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
          </svg>
        </button>
        <button class="icon-btn" id="btnScreensaver" title="Modo Relógio">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Quick Action Bar -->
    <section class="quick-actions-bar">
      <div class="section-label">AÇÕES RÁPIDAS</div>
      <div class="quick-actions-grid">
        <button class="quick-action-card action-gate" id="actionGate">
          <div class="qa-icon">🚪</div>
          <div class="qa-info">
            <span class="qa-name">Abrir Porteira</span>
            <span class="qa-sub" id="gateSub">Disponível</span>
          </div>
          <div class="qa-pulse" id="gatePulse"></div>
        </button>

        <button class="quick-action-card action-light" id="actionSalaLight">
          <div class="qa-icon">💡</div>
          <div class="qa-info">
            <span class="qa-name">Luz da Sala</span>
            <span class="qa-sub" id="salaSub">Alternar</span>
          </div>
        </button>

        <button class="quick-action-card action-gramado" id="actionGramado">
          <div class="qa-icon">🌱</div>
          <div class="qa-info">
            <span class="qa-name">Gramado</span>
            <span class="qa-sub" id="gramadoSub">Alternar</span>
          </div>
        </button>

        <button class="quick-action-card action-heat" id="actionHeatPump">
          <div class="qa-icon">♨️</div>
          <div class="qa-info">
            <span class="qa-name">Heat Pump</span>
            <span class="qa-sub" id="heatSub">Aquecimento</span>
          </div>
        </button>

        <button class="quick-action-card action-alloff" id="actionAllOff">
          <div class="qa-icon">🌙</div>
          <div class="qa-info">
            <span class="qa-name">Modo Dormir</span>
            <span class="qa-sub">Desligar Luzes</span>
          </div>
        </button>
      </div>
    </section>

    <!-- Filter Tabs -->
    <nav class="category-tabs">
      <button class="tab-btn active" data-tab="all">Todos os Dispositivos (<span id="totalCount">9</span>)</button>
      <button class="tab-btn" data-tab="living">Sala, Cozinha & Quartos</button>
      <button class="tab-btn" data-tab="access">Portões & Muro</button>
      <button class="tab-btn" data-tab="utility">Heat Pump, Poço & Jardim</button>
    </nav>

    <!-- Device Grid -->
    <main class="devices-grid" id="devicesGrid">
      <!-- Cards rendered dynamically via JavaScript -->
    </main>

    <!-- Floating Toast Notification -->
    <div class="toast-container" id="toast">Comando enviado!</div>
  </div>

  <!-- Ambient Screensaver Overlay -->
  <div class="screensaver-overlay" id="screensaver">
    <div class="ss-content">
      <div class="ss-clock" id="ssClock">00:00</div>
      <div class="ss-date" id="ssDate">Carregando...</div>
      <div class="ss-tip">Toque em qualquer lugar para despertar a tela</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
